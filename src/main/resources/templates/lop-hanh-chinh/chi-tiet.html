<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Chi tiết lớp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<main class="container">
    <div class="page-head">
        <div class="page-title">
            <div class="eyebrow">Danh sách sinh viên</div>
            <h1 th:text="${lop.tenLopHc}"></h1>
            <p><span class="cell-code" th:text="${lop.maLopHc}"></span> · Danh sách sinh viên thuộc lớp hành chính.</p>
        </div>
        <a class="btn ghost" th:href="@{/lop-hanh-chinh}">← Quay lại</a></div>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ tên</th>
                <th>Ngày sinh</th>
                <th>Giới tính</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s:${dsSinhVien}">
                <td class="cell-code" th:text="${s.maSv}"></td>
                <td class="cell-strong" th:text="${s.hoTen}"></td>
                <td th:text="${s.ngaySinh}"></td>
                <td th:text="${s.gioiTinh=='Nu'?'Nữ':s.gioiTinh}"></td>
                <td><span class="status-good" th:text="${s.trangThai}"></span></td>
                <td><a class="btn info" th:href="@{/sinh-vien/{id}/bang-diem(id=${s.maSv})}">◉ Xem điểm</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
